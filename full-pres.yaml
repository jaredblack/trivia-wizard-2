    question: |
      *plot point occurs*

      "Wow!" said Elend, "I can't believe that plot point just occured! That means these four explicit things: 1, 2, 3, and 4!"

      That means 1, 2, 3, and 4 won't be far behind, Vin thought uneasily. She smiled at Elend and felt wishy-washy about her feelings toward him.

      Ham nodded. Breeze grinned. 

      "1, 2, 3, and 4 won't be easy," said Sazed. "Do you remember when X, Y, and Z happened? That explains why 4 will follow 3."

      Vin wasn't sure if she wanted to wear a dress or pants. It was a big deal to her.
    answer: The Well of Ascension (Mistborn). 1 star. 
  - type: question
    id: TVV
    question: I probably judge [redacted] unfairly because, well, it's just not [redacted]. I think I was expecting to much of it. I was also upset by, and this is silly, the fact that Jo turned down Teddy's proposal which then led me to view Jo's and the professor's relationship negatively.
    answer: Little Men (Little Women)
  - type: question
    id: KQI
    question: Why I didn't like it? The protagonist never learned a lesson of any sort whatsoever. Throughout the book, it was hinted at that his elder brother (Rodrick) had a horrific secret held over his head. I was honestly eagerly waiting for Rodrick to let that cat out of the bag, because as odious as Rodrick was depicted to be, the protagonist himself was even more of a jerk.
    answer: Rodrick Rules (Diary of a Wimpy Kid), 1 star    
  - type: question
    id: DTK
    question: Nie oceniłam pierwszego tomu, ale obok tego nie przejdę obojętnie. Romantyzowanie myśli samobójczych nie jest właściwie, tak jak budowanie relacji na toksycznych motywach. Pomijam, że cała książka jest pisana na kolanie.
    answer: not yet
  - type: question
    id: DTK
    question: I didn’t rate the first volume, but I can’t simply overlook this one. Romanticizing suicidal thoughts is wrong, just as building a relationship on toxic foundations is. Not to mention that the entire book feels hastily thrown together.
    answer: New Moon (Twilight)

